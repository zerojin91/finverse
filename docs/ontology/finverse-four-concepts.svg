<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">FINVERSE 네 가지 기본 개념의 연결관계</title>
  <desc id="desc">시장, 경제, 외부 사건, 사람들의 심리가 서로 영향을 주고받는 관계도</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .box { rx: 22; ry: 22; stroke-width: 2; filter: url(#shadow); }
      .title { font: 700 28px Pretendard, Arial, sans-serif; fill: #0f172a; }
      .body { font: 500 18px Pretendard, Arial, sans-serif; fill: #334155; }
      .small { font: 500 16px Pretendard, Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1400" height="820" fill="#f8fafc"/>
  <text x="700" y="56" text-anchor="middle" class="title" font-size="34">네 가지 기본 개념은 서로 연결되어 있다</text>
  <text x="700" y="88" text-anchor="middle" class="small">시장 상황을 이해하려면 네 영역의 정보와 상호작용을 함께 봐야 한다</text>

  <rect x="80" y="180" width="300" height="180" class="box" fill="#ecfdf5" stroke="#10b981"/>
  <text x="230" y="230" text-anchor="middle" class="title">시장</text>
  <text x="230" y="270" text-anchor="middle" class="body">지수·섹터·종목</text>
  <text x="230" y="301" text-anchor="middle" class="small">가격·거래량·수급</text>
  <text x="230" y="328" text-anchor="middle" class="small">실제로 무엇이 움직였나?</text>

  <rect x="1020" y="180" width="300" height="180" class="box" fill="#fff7ed" stroke="#f97316"/>
  <text x="1170" y="230" text-anchor="middle" class="title">경제</text>
  <text x="1170" y="270" text-anchor="middle" class="body">금리·환율·물가·고용</text>
  <text x="1170" y="301" text-anchor="middle" class="small">국채 수익률·경기지표</text>
  <text x="1170" y="328" text-anchor="middle" class="small">어떤 환경에 놓였나?</text>

  <rect x="80" y="520" width="300" height="180" class="box" fill="#fef2f2" stroke="#ef4444"/>
  <text x="230" y="570" text-anchor="middle" class="title">외부 사건</text>
  <text x="230" y="610" text-anchor="middle" class="body">뉴스·정책·기업 실적</text>
  <text x="230" y="641" text-anchor="middle" class="small">지정학·공급망 이슈</text>
  <text x="230" y="668" text-anchor="middle" class="small">무슨 일이 원인이었나?</text>

  <rect x="1020" y="520" width="300" height="180" class="box" fill="#faf5ff" stroke="#a855f7"/>
  <text x="1170" y="570" text-anchor="middle" class="title">사람들의 심리</text>
  <text x="1170" y="610" text-anchor="middle" class="body">커뮤니티·관심도</text>
  <text x="1170" y="641" text-anchor="middle" class="small">공포·낙관·FOMO</text>
  <text x="1170" y="668" text-anchor="middle" class="small">사람들은 어떻게 반응하나?</text>

  <path d="M380 250 C590 150 810 150 1020 250" class="arrow"/>
  <text x="700" y="165" text-anchor="middle" class="small">경제 환경이 시장에 영향</text>
  <path d="M380 610 C600 720 800 720 1020 610" class="arrow"/>
  <text x="700" y="760" text-anchor="middle" class="small">외부 사건이 심리와 시장 반응을 자극</text>
  <path d="M230 520 L230 360" class="arrow"/>
  <text x="170" y="450" text-anchor="middle" class="small" transform="rotate(-90 170 450)">외부 사건이 시장을 움직임</text>
  <path d="M1170 520 L1170 360" class="arrow"/>
  <text x="1230" y="450" text-anchor="middle" class="small" transform="rotate(90 1230 450)">심리가 시장 움직임을 확대·완화</text>
  <path d="M380 330 C600 420 800 420 1020 330" class="arrow"/>
  <text x="700" y="395" text-anchor="middle" class="small">시장 변화가 사람들의 심리를 바꿈</text>

  <rect x="485" y="470" width="430" height="72" rx="18" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="700" y="500" text-anchor="middle" class="title" font-size="23">현재 시장 상황</text>
  <text x="700" y="526" text-anchor="middle" class="small">네 영역의 정보와 관계를 연결한 결과</text>
</svg>
