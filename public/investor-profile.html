<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나의 투자 성향 파악하기 · finverse</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root { --fv-ink:#111113; --fv-text:#27272a; --fv-muted:#71717a; --fv-line:#e4e4e7; --fv-bg:#fafafa; --fv-blue:#0769ff; }
    * { box-sizing:border-box; } body { margin:0; background:var(--fv-bg); color:var(--fv-text); font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif; } button { font:inherit; } button:focus-visible,a:focus-visible { outline:3px solid #0769ff33; outline-offset:3px; }
    .header { height:76px; display:flex; align-items:center; justify-content:space-between; padding:0 36px; border-bottom:1px solid var(--fv-line); background:#fff; }.brand { color:var(--fv-ink); font-size:24px; font-weight:750; letter-spacing:-.065em; text-decoration:none; }.brand span { color:var(--fv-blue); }.header-label { color:var(--fv-muted); font-size:12px; font-weight:650; }
    .screen { width:min(calc(100% - 48px),900px); margin:0 auto; padding:80px 0 72px; }.intro { max-width:980px; }.eyebrow { margin:0 0 12px; color:var(--fv-muted); font-size:10px; font-weight:750; letter-spacing:.12em; }.intro h1,.question h1,.result-heading h1 { margin:0; color:var(--fv-ink); font-size:clamp(34px,5vw,58px); font-weight:650; letter-spacing:-.065em; line-height:1.12; }.intro-lead { max-width:540px; margin:22px 0 42px; color:var(--fv-muted); font-size:16px; line-height:1.75; letter-spacing:-.025em; }
    .intro-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:28px; }.intro-grid article { min-height:160px; padding:18px; border:1px solid var(--fv-line); border-radius:10px; background:#fff; }.intro-grid span { display:block; color:var(--fv-blue); font-size:11px; font-weight:750; }.intro-grid strong { display:block; margin-top:30px; color:var(--fv-ink); font-size:15px; letter-spacing:-.035em; }.intro-grid p { margin:7px 0 0; color:var(--fv-muted); font-size:12px; line-height:1.6; }
    .primary,.back,.reset { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; border-radius:8px; text-decoration:none; cursor:pointer; }.primary { min-height:46px; padding:0 17px; background:var(--fv-ink); color:#fff; font-size:13px; font-weight:700; }.primary:hover { background:#343438; }.primary:disabled { cursor:not-allowed; opacity:.35; }.progress-head { display:flex; align-items:center; justify-content:space-between; color:var(--fv-muted); font-size:11px; font-weight:700; letter-spacing:.08em; }.progress-head strong { color:var(--fv-ink); font-size:12px; letter-spacing:0; }.progress { height:2px; margin-top:12px; overflow:hidden; background:var(--fv-line); }.progress i { display:block; height:100%; background:var(--fv-ink); transition:width 180ms ease; }
    .question { padding:52px 0 32px; border-bottom:1px solid var(--fv-line); }.question h1 { max-width:760px; font-size:clamp(27px,3.6vw,42px); }.question > p:last-child { max-width:640px; margin:17px 0 0; color:var(--fv-muted); font-size:15px; line-height:1.7; }.choices { display:grid; gap:9px; margin-top:26px; }.choice { width:100%; display:grid; grid-template-columns:32px minmax(0,1fr); gap:14px; align-items:flex-start; padding:16px; border:1px solid var(--fv-line); border-radius:9px; background:#fff; color:#3f3f46; font-size:14px; line-height:1.6; text-align:left; cursor:pointer; transition:border-color 140ms ease,background 140ms ease; }.choice:hover { border-color:#a1a1aa; }.choice.selected { border-color:var(--fv-ink); background:#f6f6f7; color:var(--fv-ink); }.choice-letter { width:26px; height:26px; display:grid; place-items:center; border:1px solid #d4d4d8; border-radius:50%; color:var(--fv-muted); font-size:11px; font-weight:750; }.selected .choice-letter { border-color:var(--fv-ink); background:var(--fv-ink); color:#fff; }.actions { display:flex; align-items:center; justify-content:flex-start; margin-top:27px; }.back { min-height:42px; padding:0 9px; background:transparent; color:var(--fv-muted); font-size:13px; }.back:disabled { cursor:not-allowed; opacity:.3; }
    .result-heading { max-width:650px; }.result-heading h1 { font-size:clamp(32px,4.4vw,48px); }.result-layout { margin-top:28px; }.profile { max-width:560px; display:flex; flex-direction:column; padding:25px; border:1px solid var(--fv-line); border-radius:10px; background:#fff; }.profile-kicker { color:var(--fv-blue); font-size:10px; font-weight:750; letter-spacing:.08em; }.profile h2 { margin:9px 0 0; color:var(--fv-ink); font-size:30px; letter-spacing:-.055em; }.profile h3 { margin:19px 0 0; color:var(--fv-text); font-size:15px; line-height:1.55; letter-spacing:-.035em; }.profile p { margin:10px 0 0; color:var(--fv-muted); font-size:12px; line-height:1.7; }.profile .result-note { margin-top:28px; padding-top:17px; border-top:1px solid var(--fv-line); color:var(--fv-text); font-size:13px; font-weight:650; }.profile .primary { width:100%; margin-top:20px; }.reset { margin-top:25px; padding:8px 0; background:transparent; color:var(--fv-muted); font-size:12px; }.reset:hover { color:var(--fv-ink); }
    [hidden] { display:none!important; } @media(max-width:700px) { .header { height:64px; padding:0 20px; }.screen { width:min(calc(100% - 40px),900px); padding:52px 0; }.intro-grid,.result-layout { grid-template-columns:1fr; }.intro-grid article { min-height:0; }.intro-grid strong { margin-top:17px; }.question { padding-top:37px; }.choice { grid-template-columns:28px minmax(0,1fr); padding:14px; font-size:13px; }.result-layout { gap:28px; }.map { aspect-ratio:1.25; } }
  </style>
</head>
<body>
  <header class="header"><a class="brand" href="/" aria-label="Finverse 홈">finverse<span>.</span></a><span class="header-label">투자 성향 진단</span></header>
  <main>
    <section class="screen intro" id="intro">
      <p class="eyebrow">FIRST SIMULATION</p><h1>내가 보는 나의<br>투자 성향 파악하기</h1><p class="intro-lead">10가지 시장 장면에서 가장 가까운 대응을 고르면, 나의 판단 방식과 행동 방식을 좌표로 정리해드립니다.</p>
      <div class="intro-grid"><article><span>01</span><strong>실제 상황을 상상해요</strong><p>정답을 고르기보다, 평소의 나와 가장 가까운 행동을 선택합니다.</p></article><article><span>02</span><strong>선택은 화면에만 남아요</strong><p>문항을 푸는 동안 점수나 유형은 보이지 않아 결과를 의도적으로 고르기 어렵습니다.</p></article><article><span>03</span><strong>첫 시뮬레이션의 기준이 돼요</strong><p>결과는 이후 시나리오별 투자 행동 보고서의 출발점으로 활용됩니다.</p></article></div>
      <button class="primary" type="button" id="start">시작하기 <span aria-hidden="true">→</span></button>
    </section>
    <section class="screen" id="test" hidden></section>
    <section class="screen" id="result" hidden></section>
  </main>
  <script>
    const questions = [
      ["보유 종목에 예상보다 부정적인 실적 발표가 나왔다.","기존에는 장기 전망을 긍정적으로 보고 있었다. 시장은 장 초반 크게 하락했다. 가장 가까운 행동은?",["한 번의 실적으로 기존 판단을 바꾸지는 않는다. 기존 투자 논리가 훼손됐는지 충분히 확인할 때까지 포지션도 유지한다.","기존 전망을 바로 재검토하고 투자 논리를 낮춰 잡는다. 다만 실적 내용을 더 분석한 뒤 포지션 변경 여부를 결정한다.","장기 전망은 여전히 유효하다고 생각하지만 추가 하락이 걱정되어 우선 일부 매도한다.","실적이 기존 기대와 다르다고 판단해 전망을 바로 낮추고 포지션도 즉시 축소한다."]],
      ["보유하지 않은 종목이 강한 호재와 함께 하루 만에 크게 상승했다.","예상보다 훨씬 강한 산업 데이터가 같이 발표됐다.",["기존에 비싸다고 판단했던 종목이므로 한 번의 데이터만으로 생각을 바꾸지 않는다. 매수도 하지 않는다.","기존 생각이 틀렸을 가능성을 인정하고 적정가치를 다시 계산하지만, 새로운 가격에서 매수할지는 추가 확인한다.","여전히 가격이 과도하다고 생각하지만 더 오를 가능성이 신경 쓰여 일부라도 진입한다.","산업 환경이 예상보다 강하다고 판단을 수정하고 상승 흐름을 놓치기 전에 바로 진입한다."]],
      ["매수 직후 주가가 예상과 반대로 빠르게 하락했다.","아직 투자 논리를 명확하게 훼손하는 새로운 정보는 없다.",["처음 세운 투자 논리가 유지되는 한 판단을 바꾸지 않고 계획했던 대응 기준도 그대로 따른다.","가격 움직임 자체도 새로운 정보일 수 있다고 보고 기존 판단을 다시 검토하지만, 이유를 확인하기 전에는 포지션을 바꾸지 않는다.","투자 논리는 여전히 맞다고 생각하지만 손실 확대가 신경 쓰여 일단 포지션을 줄인다.","예상과 다른 가격 움직임을 보고 기존 판단의 신뢰도를 낮추며 바로 포지션을 줄인다."]],
      ["이미 큰 수익이 난 종목에 추가 호재가 발표됐다.","호재가 지속적인 실적 개선으로 이어질지는 아직 불확실하다.",["기존 목표가격과 매도 기준을 유지하고, 이번 뉴스만으로 투자 판단이나 포지션을 바꾸지 않는다.","기존 목표가격이 너무 낮았을 가능성을 검토해 전망을 상향하지만, 추가 매수는 후속 데이터를 본 뒤 결정한다.","기존 목표가격은 그대로지만 상승세가 더 이어질 것 같아 추가 매수한다.","새로운 호재를 반영해 전망을 상향하고 상승 기회를 활용하기 위해 바로 추가 매수한다."]],
      ["전문가와 시장 참여자 대부분이 내 견해와 반대되는 의견을 내기 시작했다.","아직 결정적인 신규 데이터는 없다.",["다른 사람들의 견해만으로 기존 판단을 수정하지 않고, 새로운 객관적 근거가 나올 때까지 기다린다.","시장의 집단적 판단도 정보라고 보고 기존 견해를 다시 평가하지만, 직접 확인할 근거가 생길 때까지 거래하지 않는다.","내 판단은 여전히 맞다고 생각하지만 시장이 반대로 움직일 것이 걱정돼 포지션을 일부 줄인다.","시장 참여자들의 견해 변화를 중요한 신호로 받아들이고 내 판단과 포지션을 빠르게 수정한다."]],
      ["보유 종목에서 서로 상반된 정보가 동시에 나왔다.","실적은 예상보다 좋았지만, 향후 전망은 예상보다 약하다.",["기존 투자 논리에서 중요하게 봤던 핵심 지표를 우선하며 전체 판단을 쉽게 바꾸지 않는다. 거래도 기존 계획대로 한다.","긍정·부정 정보를 모두 반영해 기존 전망을 수정하지만 어느 쪽 영향이 더 큰지 정리될 때까지 행동은 보류한다.","기존 관점은 유지하지만 불확실성이 커졌다고 느껴 우선 포지션을 줄인다.","새롭게 들어온 정보에 맞춰 전망을 빠르게 조정하고 그 판단에 맞게 바로 포지션도 변경한다."]],
      ["최근 두 번의 매매에서 연속으로 손실을 봤다.","곧 평소라면 매수했을 만한 새로운 기회가 나타났다.",["최근 손실과 관계없이 기존 투자 기준을 그대로 적용하고, 조건이 충족되는지 충분히 확인한 뒤 결정한다.","최근 시장에서 내 판단 기준이 잘 작동하지 않았을 가능성을 검토해 기준을 재평가하지만, 바로 진입하지는 않는다.","기존 매수 기준은 여전히 맞다고 생각하고, 손실을 만회할 기회라는 생각에 평소보다 빠르게 진입한다.","최근 손실을 계기로 기존 시장 판단을 수정하고, 새로운 기회가 더 적합하다고 판단해 바로 포지션을 잡는다."]],
      ["중앙은행 발표 직후 시장이 예상과 완전히 다른 방향으로 움직였다.","발표 내용 자체의 해석도 엇갈리고 있다.",["사전에 세운 해석이 명백히 틀렸다는 근거가 나오기 전까지 기존 관점을 유지하고 시장 반응을 더 관찰한다.","예상 밖 시장 반응을 중요하게 받아들여 기존 관점을 수정할 준비를 하지만, 가격이 안정될 때까지 거래하지 않는다.","내 해석은 여전히 맞다고 보지만 반대 방향의 시장 움직임이 부담스러워 즉시 포지션을 축소한다.","시장 반응을 보며 내 해석이 틀렸을 수 있다고 판단하고 즉시 반대 방향으로 포지션을 조정한다."]],
      ["오래 보유한 종목의 핵심 사업 환경이 조금씩 변하고 있다는 신호가 나타난다.","아직 명확한 악재라고 단정할 수준은 아니다.",["장기 투자 논리를 뒤집을 정도의 증거가 아니므로 기존 전망과 포지션을 유지한다.","작은 변화라도 장기적으로 중요할 수 있다고 보고 투자 논리를 다시 점검하지만, 확신이 생길 때까지 포지션은 유지한다.","장기 전망은 여전히 긍정적이지만 불안감이 커져 미리 일부 매도한다.","환경 변화가 시작됐다고 판단해 기존 장기 전망을 낮추고 포지션도 바로 축소한다."]],
      ["강하게 확신했던 투자 아이디어와 정반대되는 결정적인 데이터가 발표됐다.","데이터의 신뢰도는 높은 편이다.",["하나의 데이터만으로 오랫동안 형성한 투자 논리를 폐기하지 않는다. 다만 추가 확인이 끝날 때까지 새로운 행동도 하지 않는다.","기존 판단이 틀렸을 가능성을 인정하고 투자 논리를 수정한다. 다만 실제 포지션 변경은 영향 범위를 다시 계산한 뒤 진행한다.","기존 투자 논리에 대한 믿음은 유지하지만 추가 손실이 우려돼 즉시 포지션을 줄인다.","기존 판단을 폐기하고 새로운 정보를 기준으로 전망과 포지션을 즉시 변경한다."]]
    ];
    const moves = [[-.5,.5],[.5,.5],[-.5,-.5],[.5,-.5]];
    const profiles = { anchor:["원칙형","The Anchor","기준이 흔들리기 전까지, 행동을 서두르지 않습니다.","새로운 정보가 들어와도 투자 논리와 계획을 먼저 점검하는 편입니다. 시뮬레이션에서는 반증 조건을 놓치지 않는지 함께 살펴보세요."], adapter:["전략형","The Adapter","새 정보를 반영하되, 행동은 계획 안에서 결정합니다.","판단을 유연하게 업데이트하면서도 바로 움직이기보다 근거와 순서를 확인합니다. 시뮬레이션에서 강점과 빈틈을 구체적인 행동 기준으로 바꿔보세요."], defender:["고집 반응형","The Defender","관점은 유지하지만, 불확실성에 빠르게 반응합니다.","기존 논리를 지키려는 힘과 손실을 줄이려는 행동이 함께 나타납니다. 시뮬레이션에서는 판단과 행동의 기준이 서로 어긋나는 순간을 확인합니다."], chaser:["추격형","The Chaser","새 정보와 가격 변화에 빠르게 맞춰 움직입니다.","변화에 민감하게 반응하는 만큼, 행동 전에 확인할 최소 기준이 중요합니다. 시뮬레이션에서 속도가 도움이 되는 때와 비용이 되는 때를 구분해보세요."] };
    let current = 0, answers = [];
    const intro = document.querySelector('#intro'), test = document.querySelector('#test'), result = document.querySelector('#result');
    const escapeHtml = value => value.replace(/[&<>"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[char]));
    function show(view) { intro.hidden = view !== 'intro'; test.hidden = view !== 'test'; result.hidden = view !== 'result'; window.scrollTo({ top:0, behavior:'smooth' }); }
    function renderQuestion() { const [title,context,choices] = questions[current], selected = answers[current]; test.innerHTML = `<div class="progress-head"><span>QUESTION ${String(current+1).padStart(2,'0')}</span><strong>${current+1} / ${questions.length}</strong></div><div class="progress"><i style="width:${(current+1)/questions.length*100}%"></i></div><div class="question"><p class="eyebrow">시장 상황</p><h1>${escapeHtml(title)}</h1><p>${escapeHtml(context)}</p></div><div class="choices" role="radiogroup" aria-label="가장 가까운 대응 선택">${choices.map((choice,index) => `<button class="choice ${selected===index?'selected':''}" type="button" role="radio" aria-checked="${selected===index}" data-choice="${index}"><span class="choice-letter">${selected===index?'✓':'ABCD'[index]}</span><span>${escapeHtml(choice)}</span></button>`).join('')}</div><div class="actions"><button class="back" type="button" id="back" ${current===0?'disabled':''}>← 이전</button></div>`; test.querySelectorAll('[data-choice]').forEach(button => button.addEventListener('click', () => { answers[current] = Number(button.dataset.choice); if(current === questions.length - 1) renderResult(); else { current++; renderQuestion(); } })); test.querySelector('#back').addEventListener('click', () => { if(current){current--;renderQuestion();} }); }
    function renderResult() { const score = answers.reduce((sum,answer) => ({x:sum.x+moves[answer][0],y:sum.y+moves[answer][1]}),{x:0,y:0}), key = score.x < 0 ? (score.y >= 0 ? 'anchor':'defender') : (score.y >= 0 ? 'adapter':'chaser'), profile = profiles[key]; result.innerHTML = `<div class="result-heading"><h1>나의 투자 성향</h1></div><div class="result-layout"><article class="profile"><span class="profile-kicker">${profile[1]}</span><h2>${profile[0]}</h2><h3>${profile[2]}</h3><p>${profile[3]}</p><p class="result-note">시뮬레이션을 통해 파악한 나의 실제 모습과 비교해보세요.</p><a class="primary" href="/">첫 시뮬레이션 시작하기 <span aria-hidden="true">→</span></a></article></div><button class="reset" id="restart" type="button">↻ 다시 응답하기</button>`; result.querySelector('#restart').addEventListener('click', start); show('result'); }
    function start() { current=0; answers=[]; renderQuestion(); show('test'); }
    document.querySelector('#start').addEventListener('click', start);
  </script>
</body>
</html>
