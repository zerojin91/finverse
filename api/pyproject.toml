[project]
name = "fin-api"
version = "0.1.0"
description = "FINVERSE API: 온톨로지 그래프 조회 (graph.node / graph.edge)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fin_api"]
