[project]
name = "finverse-workspace"
version = "0.1.0"
description = "Isolated development runner for the FINVERSE web service"
requires-python = ">=3.12"
dependencies = [
    "camel-ai==0.2.78",
    "camel-oasis==0.2.5",
    "deepagents==0.7.1",
    "ddgs>=9.0.0",
    "flask>=3.0.0",
    "langchain-openai>=1.0.0",
    "flask-cors>=6.0.0",
    "mcp>=1.3.0,<2.0.0",
    "neo4j>=5.15.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
    # 페이퍼 트레이딩 엔진
    "httpx>=0.27.0",
    "psycopg[binary]>=3.1.0",
    # VIX 등 외부 지수. 없으면 변동성 레짐이 중립으로 떨어질 뿐 동작은 한다.
    "yfinance>=0.2.40",
]

[tool.uv]
package = false
cache-dir = ".uv-cache"
